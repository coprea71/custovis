name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, zip, fileinfo, intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer validieren
        run: composer validate --strict

      - name: PHP-Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Sicherheitsprüfung der Abhängigkeiten
        run: composer audit --no-interaction

      - name: Frontend bauen
        run: |
          npm ci
          npm run build

      - name: Code-Stil (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

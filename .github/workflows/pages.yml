name: Website

# Publishes the static landing page in site/ to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/screenshots/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Screenshots live once in .github/screenshots (used by the README as well).
      - name: Screenshots übernehmen
        run: mkdir -p site/assets/screenshots && cp .github/screenshots/* site/assets/screenshots/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
